name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: true

      - name: Format
        run: test -z "$(gofmt -l cmd internal)"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/llmm

      - name: Test with coverage profile
        run: go test -coverprofile=coverage.out ./...

      - name: Install go-covercheck
        run: go install github.com/mach6/go-covercheck/cmd/go-covercheck@latest

      - name: Enforce coverage thresholds (statements, branches, lines)
        run: go-covercheck coverage.out
