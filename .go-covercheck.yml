# Coverage thresholds enforced by go-covercheck in CI.
# llmm requires every logic branch (block) to be covered; statements and
# lines are also enforced at the same strict bar.
#
#   blocks  = branch coverage (if/else, switch cases, loop bodies)
#   statements = statement coverage
#   lines    = line coverage
#
# If a branch is provably unreachable (e.g. a defensive error return that
# cannot trigger for a valid struct), document it in the PR and lower only
# that metric, never the branch gate.
statementThreshold: 100.0
blockThreshold: 100.0
lineThreshold: 100.0

# cmd/llmm's main() calls os.Exit(run(version)); os.Exit never completes its
# instrumentation block, so main.go's final line is provably uncoverable.
# run() itself is unit-tested (cmd/llmm/main_test.go); only the one-line
# entrypoint is excluded from the gate. The skip matches the module-prefixed
# profile filename (github.com/magiodev/llmm/cmd/llmm/main.go) as a substring,
# so it stays scoped to main.go only — any other logic added under cmd/llmm/
# remains in the 100% gate.
skip:
  - "cmd/llmm/main.go"
